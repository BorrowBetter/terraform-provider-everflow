# Terraform Provider release workflow.
#
# Triggered on tags matching v*, this workflow:
#   1. Authenticates to AWS via GitHub OIDC (no static credentials)
#   2. Fetches the GPG signing key from AWS Secrets Manager
#   3. Imports the key and runs goreleaser to build, sign, and upload
#      multi-platform archives + SHA256SUMS + detached signature
#
# The GPG key lives authoritatively in AWS Secrets Manager
# (borrowbetter/terraform/provider-gpg) and NEVER in GitHub Actions
# secrets. The only GH state is the AWS_RELEASE_ROLE_ARN *variable*.
#
# OIDC trust scope: the AWS role's trust policy pins the subject to
# repo:BorrowBetter/terraform-provider-everflow:ref:refs/tags/v*, so
# even if this workflow file were modified to run on push/pull_request
# the STS AssumeRoleWithWebIdentity call would fail.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # goreleaser uploads artifacts to the GitHub release
  id-token: write # mandatory for the OIDC token request

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Pinned by commit SHA rather than tag: this step handles the OIDC
      # exchange and is the most security-sensitive action in the workflow.
      # SHA = tag v6.1.0 at time of pinning (Node 24 runtime). Refresh via:
      #   gh api repos/aws-actions/configure-aws-credentials/git/refs/tags/v6.1.0
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: gha-everflow-provider-release-${{ github.run_id }}

      # Fetch the GPG bundle directly from Secrets Manager via the AWS CLI
      # (pre-installed on GitHub-hosted runners). Each field is masked in
      # the job log before being exported via $GITHUB_ENV so downstream
      # steps (and goreleaser) can reference them as $GPG_FINGERPRINT and
      # $GPG_PASSPHRASE without the values ever appearing in logs.
      - name: Fetch and import GPG signing key
        run: |
          set -euo pipefail
          secret=$(aws secretsmanager get-secret-value \
            --secret-id borrowbetter/terraform/provider-gpg \
            --query SecretString --output text)

          fingerprint=$(printf '%s' "$secret" | jq -r .gpg_fingerprint)
          passphrase=$(printf '%s' "$secret" | jq -r .gpg_passphrase)

          echo "::add-mask::$fingerprint"
          echo "::add-mask::$passphrase"

          printf '%s' "$secret" | jq -r .gpg_private_key | gpg --batch --import

          # Sanity check: the imported secret key must match the
          # advertised fingerprint. Fail fast if not.
          if ! gpg --batch --list-secret-keys --with-colons "$fingerprint" >/dev/null 2>&1; then
            echo "::error::GPG import succeeded but fingerprint $fingerprint is not present in the keyring"
            exit 1
          fi

          {
            echo "GPG_FINGERPRINT=$fingerprint"
            echo "GPG_PASSPHRASE=$passphrase"
          } >> "$GITHUB_ENV"

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ env.GPG_FINGERPRINT }}
          GPG_PASSPHRASE: ${{ env.GPG_PASSPHRASE }}
